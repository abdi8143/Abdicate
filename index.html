<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AbdiChat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    header {
      background: #17243a;
      padding: 22px;
      text-align: center;
      border-bottom: 2px solid #20c997;
    }

    header h1 {
      margin: 0;
      color: #20c997;
      font-size: 30px;
    }

    header p {
      color: #b8c5d6;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      padding: 25px;
      background: #17243a;
      border-radius: 15px;
    }

    .welcome h2 {
      color: #20c997;
    }

    .chat {
      margin-top: 25px;
      background: #17243a;
      border-radius: 15px;
      padding: 20px;
    }

    #messages {
      height: 250px;
      overflow-y: auto;
      padding: 10px;
      background: #101827;
      border-radius: 10px;
    }

    .message {
      background: #245b56;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #20c997;
      color: #101827;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      color: #9aabc0;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>AbdiChat</h1>
    <p>Connect. Chat. Share.</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome to AbdiChat!</h2>
      <p>Your new messaging platform starts here.</p>
      <p>Simple, modern and easy to use.</p>
    </div>

    <div class="chat">
      <h2>My Chat</h2>

      <div id="messages">
        <div class="message">
          Welcome to AbdiChat! Send your first message.
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Write a message..."
        >

        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

  <footer>
    © 2026 AbdiChat. All rights reserved.
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (text === "") return;

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = text;

      messages.appendChild(message);
      input.value = "";

      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
